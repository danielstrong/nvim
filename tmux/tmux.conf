# ==========
#  Panes
# ==========
bind -N "Pane Menu" w display-menu -x C -y C -T "panes" \
    "Kill Pane" x "confirm-before -p 'kill-pane #P? (y/n)' kill-pane" \
    "Select Next Pane" n "select-pane -t :.+" \
    "Select Prev Pane" p "select-pane -t :.-" \
    "Switch Pane" f "display-popup -d '#{pane_current_path}' -w 80% -h 60% -x C -y C -E '~/.config/nvim/tmux/fuzzy-tmux-pane.sh -a'" \
    "Open/New Pane" F "display-popup -d '#{pane_current_path}' -w 80% -h 60% -x C -y C -E '~/.config/nvim/tmux/fuzzy-tmux-pane.sh'" \
    "Choose Pane" i "display-panes -d 0" \
    "Split Horizontal" s "split-window -v -c '#{pane_current_path}'" \
    "Split Vertical" S "split-window -h -c '#{pane_current_path}'" \
    "Split Horizontal Before" v "split-window -b -v -c '#{pane_current_path}'" \
    "Split Vertical Before" v "split-window -b -h -c '#{pane_current_path}'" \
    "Swap Pane Up" K "swap-pane -U" \
    "Swap Pane Down" J "swap-pane -D" \
    "Swap with First Pane" H "if '[ #{pane_index} -eq 1 ]' 'swap-pane -s \"!\"' 'select-pane -t:.1 ; swap-pane -d -t 1 -s \"!\"'" \
    "" \
    "Select Pane 1" 1 "select-pane -t 1" \
    "Select Pane 2" 2 "select-pane -t 2" \
    "Select Pane 3" 3 "select-pane -t 3" \
    "Select Pane 4" 4 "select-pane -t 4" \
    "Select Pane 5" 5 "select-pane -t 5" \
    "Select Pane 6" 6 "select-pane -t 6" \
    "Select Pane 7" 7 "select-pane -t 7" \
    "Select Pane 8" 8 "select-pane -t 8" \
    "" \
    "Layout Even Horizontal" e "select-layout even-horizontal" \
    "Layout Even Vertical" E "select-layout even-vertical" \
    "Layout Main Horizontal" m "select-layout main-horizontal" \
    "Layout Main Vertical" M "select-layout main-vertical" \
    "Layout Tiled" t "select-layout tiled" \
    "Layout Next" l "next-layout" \
    "Layout Even" = "select-layout -E" \
    "" \
    "quit" q ""
bind -N "Break Pane" , break-pane
bind -N "Send Pane to Window" . command-prompt -p "Send pane to window: "  "join-pane -t :'%%'"
bind -N "Select Next Pane" -r f select-pane -t :.+
bind -N "Select Prev Pane" -r F select-pane -t :.-
