# https://github.com/samoshkin/tmux-config/blob/master/tmux/tmux.conf
# ==========
#  Tmux
# ==========
bind -N "Tmux Menu" t display-menu -x C -y C -T "tmux" \
    "Copy CWD to clipboard" y "run-shell 'tmux set-buffer \"#{pane_current_path}\" ; echo \"#{pane_current_path}\" | pbcopy ; tmux display \"Copied: #{pane_current_path}\"'" \
    "Toggle Mouse" m "set-option mouse" \
    "Toggle Status bar" f "set-option status" \
    "Display info" g "display 'Terminal: #{client_termname} '" \
    "Display window information" i "display-message" \
    "Show a clock" a "clock-mode" \
    "Choose Buffer to paste" ] "choose-buffer" \
    "List Keys" q "list-keys -N" \
    "Lookup Key" ? "command-prompt -k -p key \"list-keys -1N '%%%'\"" \
    "Refresh Client" R "refresh-client" \
    "" \
    "Edit Tmux Config" e "new-window -n 'tmux.conf' bash -c \"nvim ~/.config/tmux/tmux.conf && tmux source ~/.config/tmux/tmux.conf\"" \
    "Reload Tmux Config" r "source-file ~/.config/tmux/tmux.conf" \
    "Reload Theme" t "source-file ~/.config/nvim/tmux/powerline-theme.conf" \
    "" \
    "quit" q ""
bind -N "Edit Tmux Config" - new-window -n "tmux.conf" bash -c 'nvim ~/.config/tmux/tmux.conf && tmux source ~/.config/tmux/tmux.conf'
bind -N "Reload Tmux Config" _ source-file ~/.config/tmux/tmux.conf
bind -T root  o if -F "#{==:#{pane_mode},tree-mode}" "send 'Enter'" "send o" # use o to select things in tree
# ==========
#  Sessions
# ==========
bind -N "Session Menu" e display-menu -x C -y C -T "sessions" \
    "Kill Session" x "confirm-before -p 'kill session #S? (y/n)' kill-session" \
    "Next Session" n "switch-client -n" \
    "Prev Session" p "switch-client -p" \
    "Switch Session" f "display-popup -d '#{pane_current_path}' -w 80% -h 60% -x C -y C -E '~/.config/nvim/tmux/tmux-fuzzy-picker.sh'" \
    "Choose Session" p "choose-tree -ZsK '#{?#{e|<:#{line},9},#{e|+:1,#{line}},#{?#{e|<:#{line},35},M-#{a:#{e|+:97,#{e|-:#{line},9}}},}}'" \
    "Open/Start Session" O "neww ~/.config/nvim/tmux/ts.sh" \
    "Rename Session" r "command-prompt -I '#S' \"rename-session -- '%%'\"" \
    "" \
    "Workmux Sidebar" s "run-shell 'workmux sidebar'" \
    "" \
    "quit" q ""
bind -N "Select Next Session" -r ) switch-client -n
bind -N "Select Prev Session" -r ( switch-client -p
bind -N "Choose a session from a list" p choose-tree -ZsK '#{?#{e|<:#{line},9},#{e|+:1,#{line}},#{?#{e|<:#{line},35},M-#{a:#{e|+:97,#{e|-:#{line},9}}},}}'
bind -N "Switch Session" o display-popup -d '#{pane_current_path}' -w 80% -h 60% -x C -y C -E '~/.config/nvim/tmux/tmux-fuzzy-picker.sh'
bind -N "Open/Start Session" O display-popup -d '#{pane_current_path}' -w 80% -h 60% -x C -y C -E '~/.config/nvim/tmux/fuzzy-tmux-session.sh'
# bind -N "Open Session or Start Session" O run-shell "tmux neww ~/.config/nvim/tmux/ts.sh"
bind -N "Detach the current client" D detach-client
bind -N "Rename Session" R command-prompt -I "#S" "rename-session -- '%%'"
bind -N "Workmux Dashboard" P popup -d '#{pane_current_path}' -w 100% -h 100% -x C -y C -E 'workmux dashboard'
bind -N "Workmux Next Agent" H run-shell '~/.config/nvim/tmux/workmux-next-agent.sh'

# ==========
#  Windows
# ==========
bind -N "Window Menu" q display-menu -x C -y C -T "windows" \
    "Kill Window" x "confirm-before -p 'kill window #I (#W)? (y/n)' kill-window" \
    "Next Window" n "next-window" \
    "Prev Window" p "previous-window" \
    "Switch Window" f "display-popup -d '#{pane_current_path}' -w 80% -h 60% -x C -y C -E '~/.config/nvim/tmux/tmux-fuzzy-picker.sh -w'" \
    "Choose Window" o "choose-window" \
    "Search for Window" / "command-prompt \"find-window '%%'\"" \
    "Swap Window Next" L "swap-window -t +1 ; select-window -t +1" \
    "Swap Window Prev" H "swap-window -t -1 ; select-window -t -1" \
    "New Window" c "new-window -c '#{pane_current_path}'" \
    "New Window at current" C "new-window" \
    "Rename Window" r "command-prompt -I '#W' \"rename-window -- '%%'\"" \
    "" \
    "Select Window 1" 1 "select-window -t 1" \
    "Select Window 2" 2 "select-window -t 2" \
    "Select Window 3" 3 "select-window -t 3" \
    "Select Window 4" 4 "select-window -t 4" \
    "Select Window 5" 5 "select-window -t 5" \
    "Select Window 6" 6 "select-window -t 6" \
    "Select Window 7" 7 "select-window -t 7" \
    "Select Window 8" 8 "select-window -t 8" \
    "Select Window 9" 9 "select-window -t 9" \
    "Select Window 0" 0 "select-window -t 0" \
    "" \
    "Toggle Window size" t "set -w window-size" \
    "" \
    "Layout Even Horizontal" e "select-layout even-horizontal" \
    "Layout Even Vertical" E "select-layout even-vertical" \
    "Layout Main Horizontal" m "select-layout main-horizontal" \
    "Layout Main Vertical" M "select-layout main-vertical" \
    "Layout Tiled" t "select-layout tiled" \
    "Layout Next" l "next-layout" \
    "Layout Even" = "select-layout -E" \
    "" \
    "quit" q ""
bind -N "Send Window to Session" > command-prompt -p "Send window to session: "  "move-window -t '%%':"
